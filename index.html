<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Training</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#252a34;--text:#f2f3f5;--muted:#9aa0ab;--accent:#4ade80;--ink:#062110;--danger:#f87171;--line:#2c313c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 14px) 20px 10px;background:rgba(15,17,21,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
h1{margin:0;font-size:30px;letter-spacing:-.5px}
main{padding:6px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.lbl{display:block;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.muted{color:var(--muted)}.small{font-size:14px}
.section{color:var(--muted);font-size:14px;font-weight:600;margin:18px 4px 8px}
input[type=date],input[type=text]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:17px;-webkit-appearance:none;appearance:none;min-height:46px}
input[type=date]{color-scheme:dark}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:15px}
.chip.on{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;background:var(--accent);color:var(--ink);font-weight:700;font-size:17px;text-align:center}
.btn.secondary{background:var(--card2);color:var(--text);font-weight:600}
.btn.sm{padding:10px;font-size:15px;margin-top:8px}
.btn:disabled{opacity:.35}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.ex-head strong{font-size:18px}
.set-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.set-lbl{flex:0 0 58px;color:var(--muted);font-size:15px}
.step{width:44px;height:44px;border-radius:12px;border:0;background:var(--card2);font-size:22px;line-height:1}
.reps{width:70px;height:44px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:20px;font-weight:600;-moz-appearance:textfield}
.reps::-webkit-inner-spin-button{-webkit-appearance:none}
.x{margin-left:auto;width:36px;height:36px;border:0;background:none;color:var(--muted);font-size:22px}
.hist-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.hist-row:first-of-type{border-top:0}
.row-actions{display:flex;gap:18px;justify-content:flex-end;margin-top:8px}
.link{background:none;border:0;color:var(--accent);padding:4px 0;font-size:15px}
.link.danger{color:var(--danger)}
.note{background:#1e2a22;border:1px solid #2f4a37;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:24px}
.kpi span{color:var(--muted);font-size:12px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin:14px 0 6px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--bg);color:var(--text);font-weight:600}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .val{fill:var(--text);font-size:11px;font-weight:600}
.stat-list div{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.stat-list div:first-child{border-top:0}
.up{color:var(--accent)}.down{color:var(--danger)}
.ex-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.ex-item:first-child{border-top:0}
.ex-item .name{flex:1;background:none;border:0;text-align:left;padding:8px 0;font-size:17px}
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row .btn{width:auto;padding:0 18px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:rgba(22,24,30,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.active{color:var(--accent)}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header><h1 id="title">Training</h1></header>
<main>
  <section id="view-log" class="view active"></section>
  <section id="view-history" class="view"></section>
  <section id="view-stats" class="view"></section>
  <section id="view-ex" class="view"></section>
</main>
<nav class="tabbar">
  <button data-act="tab" data-v="log" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Training</button>
  <button data-act="tab" data-v="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Verlauf</button>
  <button data-act="tab" data-v="stats"><svg viewBox="0 0 24 24"><path d="M4 20h16M7 16v-4M12 16V7M17 16v-7"/></svg>Statistik</button>
  <button data-act="tab" data-v="ex"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Übungen</button>
</nav>
<div id="toast"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
'use strict';
const KEY = 'trainingData.v1';
const DKEY = KEY + '.draft';
const DEFAULT_EX = ['Liegestütze', 'Klimmzüge', 'Kniebeugen', 'Dips', 'Ausfallschritte', 'Sit-ups'];
const TITLES = { log: 'Training', history: 'Verlauf', stats: 'Statistik', ex: 'Übungen' };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
let uidN = 0;
const uid = () => Date.now().toString(36) + (uidN++).toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const dateStr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => dateStr(new Date());
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = (s, o) => parseDate(s).toLocaleDateString('de-DE', o || { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

// ---------- Daten ----------
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.exercises) && Array.isArray(d.workouts)) return d;
  } catch (e) {}
  return { exercises: DEFAULT_EX.map(name => ({ id: uid(), name })), workouts: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch (e) { toast('Speichern fehlgeschlagen!'); }
}
const newDraft = () => ({ date: todayStr(), order: [], entries: {}, editId: null });
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DKEY));
    if (d && d.entries && Array.isArray(d.order)) { if (!d.order.length && !d.editId) d.date = todayStr(); return d; }
  } catch (e) {}
  return newDraft();
}
function saveDraft() { try { localStorage.setItem(DKEY, JSON.stringify(draft)); } catch (e) {} }

let data = load();
let draft = loadDraft();
let current = 'log';
let statEx = null, statMetric = 'total';
save();

const exName = id => (data.exercises.find(e => e.id === id) || {}).name || '(gelöschte Übung)';
const sortedDesc = () => [...data.workouts].sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
const sortedAsc = () => sortedDesc().reverse();
function lastEntry(exId, excludeId) {
  for (const w of sortedDesc()) {
    if (w.id === excludeId) continue;
    const e = w.entries.find(x => x.ex === exId);
    if (e) return { date: w.date, reps: e.reps };
  }
  return null;
}

// ---------- Training eintragen ----------
function canSave() { return draft.order.some(id => (draft.entries[id] || []).some(n => n > 0)); }

function renderLog() {
  const active = data.exercises.filter(e => !e.archived);
  let h = '';
  if (draft.editId) h += `<div class="note">Du bearbeitest ein gespeichertes Training. <button class="link" data-act="cancel-edit">Abbrechen</button></div>`;
  h += `<div class="card"><label class="lbl" for="d-date">Datum</label><input type="date" id="d-date" value="${draft.date}" max="${todayStr()}"></div>`;
  h += `<div class="card"><div class="lbl">Welche Übungen hast du gemacht?</div><div class="chips">` +
    (active.map(e => `<button class="chip ${draft.entries[e.id] ? 'on' : ''}" data-act="toggle" data-id="${e.id}">${esc(e.name)}</button>`).join('')
      || '<span class="muted">Lege zuerst unter „Übungen“ welche an.</span>') + `</div></div>`;
  for (const id of draft.order) {
    const reps = draft.entries[id];
    if (!reps) continue;
    const last = lastEntry(id, draft.editId);
    h += `<div class="card"><div class="ex-head"><strong>${esc(exName(id))}</strong><span class="muted small" id="tot-${id}">${sum(reps)} Wdh.</span></div>`;
    if (last) h += `<div class="muted small">Letztes Mal (${fmtDate(last.date, { day: 'numeric', month: 'short' })}): ${last.reps.join(' · ')}</div>`;
    reps.forEach((r, i) => {
      h += `<div class="set-row"><span class="set-lbl">Satz ${i + 1}</span>
        <button class="step" data-act="dec" data-id="${id}" data-i="${i}" aria-label="weniger">−</button>
        <input class="reps" type="number" inputmode="numeric" pattern="[0-9]*" min="0" value="${r ?? ''}" data-id="${id}" data-i="${i}" aria-label="Wiederholungen Satz ${i + 1}">
        <button class="step" data-act="inc" data-id="${id}" data-i="${i}" aria-label="mehr">+</button>
        <button class="x" data-act="rmset" data-id="${id}" data-i="${i}" aria-label="Satz entfernen">×</button></div>`;
    });
    h += `<button class="btn sm secondary" data-act="addset" data-id="${id}">+ Satz</button></div>`;
  }
  h += `<button class="btn" id="save-btn" data-act="save" ${canSave() ? '' : 'disabled'}>${draft.editId ? 'Änderungen speichern' : 'Training speichern'}</button>`;
  $('#view-log').innerHTML = h;
}

function saveWorkout() {
  const entries = draft.order.filter(id => draft.entries[id])
    .map(id => ({ ex: id, reps: draft.entries[id].map(n => Math.max(0, n | 0)).filter(n => n > 0) }))
    .filter(e => e.reps.length);
  if (!entries.length) return;
  const w = draft.editId && data.workouts.find(w => w.id === draft.editId);
  if (w) { w.date = draft.date; w.entries = entries; }
  else data.workouts.push({ id: uid(), date: draft.date, created: Date.now(), entries });
  save();
  const wasEdit = !!w;
  draft = newDraft(); saveDraft();
  toast(wasEdit ? 'Änderungen gespeichert' : 'Training gespeichert 💪');
  show('history');
}

// ---------- Verlauf ----------
function renderHistory() {
  const ws = sortedDesc();
  if (!ws.length) { $('#view-history').innerHTML = `<div class="empty">Noch keine Trainings gespeichert.<br><br><button class="btn" data-act="tab" data-v="log">Erstes Training eintragen</button></div>`; return; }
  let h = '', month = '';
  for (const w of ws) {
    const m = parseDate(w.date).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
    if (m !== month) { h += `<div class="section">${m}</div>`; month = m; }
    const total = sum(w.entries.map(e => sum(e.reps)));
    h += `<div class="card"><div class="ex-head"><strong>${fmtDate(w.date)}</strong><span class="muted small">${total} Wdh.</span></div>` +
      w.entries.map(e => `<div class="hist-row"><span>${esc(exName(e.ex))}</span><span class="muted">${e.reps.length} ${e.reps.length === 1 ? 'Satz' : 'Sätze'}: ${e.reps.join(' · ')}</span></div>`).join('') +
      `<div class="row-actions"><button class="link" data-act="edit" data-id="${w.id}">Bearbeiten</button><button class="link danger" data-act="delw" data-id="${w.id}">Löschen</button></div></div>`;
  }
  $('#view-history').innerHTML = h;
}

// ---------- Statistik ----------
function niceStep(raw) {
  if (raw <= 1) return 1;
  const p = 10 ** Math.floor(Math.log10(raw)), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}
function chart(pts) {
  const W = 340, H = 200, L = 34, R = 14, T = 20, B = 26;
  const max = Math.max(1, ...pts.map(p => p.y));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const xs = i => pts.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const ys = v => T + (H - T - B) * (1 - v / top);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80" stop-opacity=".35"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></linearGradient></defs>`;
  for (let v = 0; v <= top; v += step) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}"/><text class="axis" x="${L - 6}" y="${ys(v) + 3.5}" text-anchor="end">${v}</text>`;
  const line = pts.map((p, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(p.y).toFixed(1)).join(' ');
  if (pts.length > 1) s += `<path d="${line} L${xs(pts.length - 1)} ${ys(0)} L${xs(0)} ${ys(0)} Z" fill="url(#gr)"/><path class="line" d="${line}"/>`;
  const r = pts.length > 40 ? 2 : 3.5;
  pts.forEach((p, i) => s += `<circle class="dot" cx="${xs(i)}" cy="${ys(p.y)}" r="${r}"/>`);
  const li = pts.length - 1;
  s += `<text class="val" x="${xs(li)}" y="${ys(pts[li].y) - 9}" text-anchor="${pts.length === 1 ? 'middle' : 'end'}">${pts[li].y}</text>`;
  const lab = i => fmtDate(pts[i].x, { day: 'numeric', month: 'short' });
  if (pts.length === 1) s += `<text class="axis" x="${xs(0)}" y="${H - 6}" text-anchor="middle">${lab(0)}</text>`;
  else s += `<text class="axis" x="${xs(0)}" y="${H - 6}" text-anchor="start">${lab(0)}</text><text class="axis" x="${xs(li)}" y="${H - 6}" text-anchor="end">${lab(li)}</text>`;
  return s + '</svg>';
}
function renderStats() {
  const ws = sortedAsc();
  if (!ws.length) { $('#view-stats').innerHTML = `<div class="empty">Sobald du Trainings gespeichert hast, siehst du hier deine Entwicklung.</div>`; return; }
  const d7 = new Date(); d7.setDate(d7.getDate() - 6);
  const since = dateStr(d7);
  let h = `<div class="kpis">
    <div class="kpi"><b>${ws.length}</b><span>Trainings</span></div>
    <div class="kpi"><b>${ws.filter(w => w.date >= since).length}</b><span>letzte 7 Tage</span></div>
    <div class="kpi"><b>${sum(ws.map(w => sum(w.entries.map(e => sum(e.reps)))))}</b><span>Wdh. gesamt</span></div></div>`;
  const used = data.exercises.filter(e => ws.some(w => w.entries.some(x => x.ex === e.id)));
  if (!used.find(e => e.id === statEx)) statEx = used[0].id;
  h += `<div class="card"><div class="chips">` + used.map(e => `<button class="chip ${e.id === statEx ? 'on' : ''}" data-act="stat-ex" data-id="${e.id}">${esc(e.name)}</button>`).join('') + `</div>`;
  const pts = ws.filter(w => w.entries.some(x => x.ex === statEx)).map(w => {
    const e = w.entries.find(x => x.ex === statEx);
    return { date: w.date, total: sum(e.reps), best: Math.max(...e.reps), sets: e.reps.length };
  });
  h += `<div class="seg"><button class="${statMetric === 'total' ? 'on' : ''}" data-act="metric" data-v="total">Gesamt-Wdh.</button><button class="${statMetric === 'best' ? 'on' : ''}" data-act="metric" data-v="best">Bester Satz</button></div>`;
  h += chart(pts.map(p => ({ x: p.date, y: p[statMetric] }))) + `</div>`;

  const bestSet = pts.reduce((a, p) => p.best > a.best ? p : a, pts[0]);
  const bestTot = pts.reduce((a, p) => p.total > a.total ? p : a, pts[0]);
  const avg = Math.round(sum(pts.map(p => p.total)) / pts.length);
  let trend = '';
  if (pts.length >= 2) {
    const n = Math.min(3, Math.floor(pts.length / 2)) || 1;
    const a = sum(pts.slice(0, n).map(p => p.total)) / n, b = sum(pts.slice(-n).map(p => p.total)) / n;
    const pct = a ? Math.round((b - a) / a * 100) : 0;
    trend = `<div><span>Fortschritt (${n === 1 ? 'erstes vs. letztes' : `erste ${n} vs. letzte ${n}`})</span><b class="${pct >= 0 ? 'up' : 'down'}">${pct > 0 ? '+' : ''}${pct} %</b></div>`;
  }
  h += `<div class="card stat-list">
    <div><span>Rekord bester Satz</span><b>${bestSet.best} <span class="muted small">(${fmtDate(bestSet.date, { day: 'numeric', month: 'short' })})</span></b></div>
    <div><span>Rekord Wdh. pro Training</span><b>${bestTot.total} <span class="muted small">(${fmtDate(bestTot.date, { day: 'numeric', month: 'short' })})</span></b></div>
    <div><span>Ø Wdh. pro Training</span><b>${avg}</b></div>
    <div><span>Trainings mit dieser Übung</span><b>${pts.length}</b></div>
    ${trend}</div>`;
  $('#view-stats').innerHTML = h;
}

// ---------- Übungen & Backup ----------
function renderEx() {
  const active = data.exercises.filter(e => !e.archived);
  let h = `<div class="card"><div class="lbl">Deine Übungen</div>` +
    (active.map(e => `<div class="ex-item"><button class="name" data-act="rename" data-id="${e.id}">${esc(e.name)}</button><button class="x" data-act="delex" data-id="${e.id}" aria-label="Übung löschen">×</button></div>`).join('') || '<div class="muted">Noch keine Übungen.</div>') +
    `<div class="add-row"><input type="text" id="new-ex" placeholder="Neue Übung" enterkeyhint="done" autocomplete="off"><button class="btn" data-act="addex">Hinzufügen</button></div>
    <div class="muted small" style="margin-top:10px">Tippe auf einen Namen, um ihn zu ändern.</div></div>`;
  h += `<div class="card"><div class="lbl">Backup</div>
    <div class="muted small" style="margin-bottom:12px">Deine Daten liegen nur auf diesem iPhone. Sichere sie ab und zu, z.&nbsp;B. in der Dateien-App oder iCloud.</div>
    <button class="btn secondary" data-act="export">Backup exportieren</button>
    <button class="btn secondary" style="margin-top:8px" data-act="import">Backup importieren</button></div>`;
  $('#view-ex').innerHTML = h;
}
function addExercise() {
  const inp = $('#new-ex'), name = inp.value.trim();
  if (!name) return;
  const same = data.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
  if (same && !same.archived) { toast('Gibt es schon'); return; }
  if (same) same.archived = false; else data.exercises.push({ id: uid(), name });
  save(); renderEx(); toast('Übung hinzugefügt');
}
async function exportData() {
  const json = JSON.stringify({ app: 'training', version: 1, exported: new Date().toISOString(), ...data }, null, 2);
  const name = `training-backup-${todayStr()}.json`;
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
$('#imp').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.exercises) || !Array.isArray(d.workouts)) throw 0;
    if (!confirm(`Backup mit ${d.workouts.length} Trainings laden? Die aktuellen Daten werden ersetzt.`)) return;
    data = { exercises: d.exercises, workouts: d.workouts };
    draft = newDraft(); save(); saveDraft(); render(); toast('Backup geladen');
  } catch (e) { toast('Datei ist kein gültiges Backup'); }
});

// ---------- Navigation & Events ----------
function show(v) {
  current = v;
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  $('#title').textContent = TITLES[v];
  render(); window.scrollTo(0, 0);
}
function render() { ({ log: renderLog, history: renderHistory, stats: renderStats, ex: renderEx })[current](); }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000); }

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const { act, id, v } = b.dataset, i = +b.dataset.i;
  const reps = id && draft.entries[id];
  switch (act) {
    case 'tab': show(v); break;
    case 'toggle':
      if (draft.entries[id]) { delete draft.entries[id]; draft.order = draft.order.filter(x => x !== id); }
      else { const last = lastEntry(id, draft.editId); draft.entries[id] = last ? [...last.reps] : [10, 10, 10]; draft.order.push(id); }
      saveDraft(); renderLog(); break;
    case 'inc': reps[i] = (reps[i] || 0) + 1; saveDraft(); renderLog(); break;
    case 'dec': reps[i] = Math.max(0, (reps[i] || 0) - 1); saveDraft(); renderLog(); break;
    case 'addset': reps.push(reps.length ? reps[reps.length - 1] : 10); saveDraft(); renderLog(); break;
    case 'rmset':
      reps.splice(i, 1);
      if (!reps.length) { delete draft.entries[id]; draft.order = draft.order.filter(x => x !== id); }
      saveDraft(); renderLog(); break;
    case 'save': saveWorkout(); break;
    case 'cancel-edit': draft = newDraft(); saveDraft(); renderLog(); break;
    case 'edit': {
      const w = data.workouts.find(w => w.id === id); if (!w) break;
      draft = { date: w.date, order: w.entries.map(e => e.ex), entries: Object.fromEntries(w.entries.map(e => [e.ex, [...e.reps]])), editId: w.id };
      saveDraft(); show('log'); break;
    }
    case 'delw':
      if (confirm('Dieses Training löschen?')) {
        data.workouts = data.workouts.filter(w => w.id !== id); save();
        if (draft.editId === id) { draft = newDraft(); saveDraft(); }
        renderHistory(); toast('Gelöscht');
      } break;
    case 'stat-ex': statEx = id; renderStats(); break;
    case 'metric': statMetric = v; renderStats(); break;
    case 'addex': addExercise(); break;
    case 'rename': {
      const e = data.exercises.find(e => e.id === id);
      const n = prompt('Neuer Name:', e.name);
      if (n && n.trim()) { e.name = n.trim(); save(); renderEx(); }
      break;
    }
    case 'delex': {
      const e = data.exercises.find(e => e.id === id);
      if (!confirm(`„${e.name}“ löschen? Bereits gespeicherte Trainings bleiben erhalten.`)) break;
      if (data.workouts.some(w => w.entries.some(x => x.ex === id))) e.archived = true;
      else data.exercises = data.exercises.filter(x => x.id !== id);
      if (draft.entries[id]) { delete draft.entries[id]; draft.order = draft.order.filter(x => x !== id); saveDraft(); }
      save(); renderEx(); break;
    }
    case 'export': exportData(); break;
    case 'import': $('#imp').click(); break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'd-date') { if (t.value) { draft.date = t.value; saveDraft(); } return; }
  if (t.classList.contains('reps')) {
    const n = parseInt(t.value, 10);
    draft.entries[t.dataset.id][+t.dataset.i] = isNaN(n) ? null : Math.max(0, n);
    saveDraft();
    $('#tot-' + t.dataset.id).textContent = sum(draft.entries[t.dataset.id]) + ' Wdh.';
    $('#save-btn').disabled = !canSave();
  }
});
document.addEventListener('focusin', ev => { if (ev.target.classList.contains('reps')) ev.target.select(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'new-ex') addExercise(); });

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
